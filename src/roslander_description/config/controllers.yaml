controller_manager:
  ros__parameters:
    update_rate: 100
    use_sim_time: true

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    diff_drive_controller:
      type: diff_drive_controller/DiffDriveController

diff_drive_controller:
  ros__parameters:
    left_wheel_names:
      - wheel_front_left_joint
      - wheel_rear_left_joint
    right_wheel_names:
      - wheel_front_right_joint
      - wheel_rear_right_joint
    wheels_per_side: 2

    wheel_radius: 0.049
    wheel_separation: 0.22426
    # With vy fixed to zero, a mecanum base has an effective yaw lever arm
    # of 2 * (half wheelbase + half track) = 0.41929 m.
    wheel_separation_multiplier: 1.86964
    left_wheel_radius_multiplier: 1.0
    right_wheel_radius_multiplier: 1.0

    use_stamped_vel: false
    cmd_vel_timeout: 0.5
    publish_limited_velocity: true

    position_feedback: true
    open_loop: false
    publish_rate: 50.0
    velocity_rolling_window_size: 10

    odom_frame_id: odom
    base_frame_id: base_footprint
    enable_odom_tf: true
    pose_covariance_diagonal: [0.001, 0.001, 0.001, 0.001, 0.001, 0.01]
    twist_covariance_diagonal: [0.001, 0.001, 0.001, 0.001, 0.001, 0.01]

    linear.x.has_velocity_limits: true
    linear.x.max_velocity: 0.5
    linear.x.min_velocity: -0.5
    linear.x.has_acceleration_limits: true
    linear.x.max_acceleration: 0.5
    linear.x.min_acceleration: -0.5
    linear.x.has_jerk_limits: false

    angular.z.has_velocity_limits: true
    angular.z.max_velocity: 1.5
    angular.z.min_velocity: -1.5
    angular.z.has_acceleration_limits: true
    angular.z.max_acceleration: 1.5
    angular.z.min_acceleration: -1.5
    angular.z.has_jerk_limits: false
